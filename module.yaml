product: jvm/app

settings:
  ktor:
    enabled: true
    version: 3.6.0
  kotlin:
    version: 2.4.20
    serialization:
      format: json
      version: 1.11.0
    optIns: [ kotlin.uuid.ExperimentalUuidApi, io.ktor.utils.io.ExperimentalKtorApi ]
  jvm:
    mainClass: com.gvart.parleyroom.ApplicationKt
    release: 25
    jdk:
      version: 25

plugins:
  jib-plugin:
    enabled: true
    container:
      mainClass: com.gvart.parleyroom.ApplicationKt
      platforms:
        - architecture: amd64
          os: linux
        - architecture: arm64
          os: linux
    baseImage:
      fullName: gcr.io/distroless/java25
    targetImage:
      name: ghcr.io/gvart/parleyroom
      tags:
        - latest
        - 0.11.0 # x-release-please-version

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.server.requestValidation
  - $ktor.server.cors
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages
  - $ktor.server.callLogging
  - $ktor.server.callId
  - io.ktor:ktor-server-di
  - ch.qos.logback:logback-classic:1.6.4
  - com.zaxxer:HikariCP:7.1.0
  - org.postgresql:postgresql:42.7.13
  - $libs.exposed.core
  - $libs.exposed.dao
  - $libs.exposed.jdbc
  - $libs.exposed.datetime
  - $libs.exposed.json
  - $libs.flyway.core
  - $libs.flyway.postgresql
  - $libs.jbcrypt
  - $libs.aws.sdk.s3
  - io.livekit:livekit-server:0.16.0
  - $ktor.server.auth
  - $ktor.server.auth.jwt
  - $ktor.server.openapi
  - $ktor.server.swagger
  - $libs.ktor.openapi.routing
  - $libs.koog.agents.core
  - $libs.koog.anthropic
  - $libs.koog.http.client.ktor
  - $libs.json.schema.validator

test-dependencies:
  - $ktor.server.testHost
  - $ktor.client.contentNegotiation
  - $libs.testcontainers
  - $libs.testcontainers.postgresql
  - $libs.testcontainers.junit.jupiter

