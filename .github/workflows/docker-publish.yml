name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parley-room
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: parley-room
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
          key: ${{ runner.os }}-kotlin-toolchain-${{ hashFiles('parley-room/kotlin', 'parley-room/module.yaml', 'parley-room/libs.versions.toml', 'parley-room/plugins/**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-toolchain-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image with Jib
        env:
          KOTLIN_CLI_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./kotlin do jib
