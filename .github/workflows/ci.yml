name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
          key: ${{ runner.os }}-kotlin-toolchain-${{ hashFiles('kotlin', 'module.yaml', 'libs.versions.toml', 'plugins/**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-toolchain-

      # Testcontainers (Postgres, MinIO) uses the runner's Docker daemon.
      - name: Test
        env:
          KOTLIN_CLI_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./kotlin test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
          if-no-files-found: ignore
